<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Монополия Онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #101318;
  --color-surface: #181d24;
  --color-surface-2: #202734;
  --color-surface-3: #273142;
  --color-border: rgba(255,255,255,0.10);
  --color-text: #eef2ff;
  --color-text-muted: #97a3bd;
  --color-primary: #4f98a3;
  --color-primary-hover: #227f8b;
  --color-accent: #e8af34;
  --color-green: #6daa45;
  --color-red: #d16363;
  --color-blue: #5591c7;
  --color-pink: #c36be0;
  --color-cyan: #54c7d3;
  --color-orange: #f29a4a;
  --font-display: 'Russo One', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.18);
  --shadow-md: 0 10px 26px rgba(0,0,0,0.28);
  --shadow-lg: 0 22px 60px rgba(0,0,0,0.42);
  --transition: 180ms cubic-bezier(0.16,1,0.3,1);
  --board-scale: 1;
  --board-max-size: 760;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  text-size-adjust: none; -webkit-font-smoothing: antialiased;
}

body {
  font-family: var(--font-body);
  background:
    radial-gradient(circle at top, rgba(79,152,163,0.10), transparent 38%),
    radial-gradient(circle at bottom right, rgba(232,175,52,0.08), transparent 30%),
    var(--color-bg);
  color: var(--color-text);
  display: flex; flex-direction: column;
}

button, input, select { font: inherit; }

.screen { display: none; width: 100%; height: 100%; }
.screen.active { display: flex; }

#lobby {
  flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 0%, rgba(79,152,163,0.15) 0%, transparent 70%),
              radial-gradient(ellipse at 80% 80%, rgba(232,175,52,0.08) 0%, transparent 60%),
              var(--color-bg);
  gap: 0;
}

.lobby-title {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 6vw, 5rem);
  background: linear-gradient(135deg, #e8af34, #c36be0, #4f98a3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center; line-height: 1; margin-bottom: 8px;
  filter: drop-shadow(0 0 30px rgba(79,152,163,0.4));
}

.lobby-subtitle {
  color: var(--color-text-muted); font-size: 1rem;
  text-align: center; margin-bottom: 40px;
}

.lobby-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: 32px 36px;
  width: min(460px, 92vw);
  box-shadow: var(--shadow-lg);
}

.lobby-card h2 {
  font-family: var(--font-display); font-size: 1.2rem;
  color: var(--color-text); margin-bottom: 24px;
  text-align: center; letter-spacing: 0.05em;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.8rem; font-weight: 700;
  color: var(--color-text-muted); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 6px;
}
.form-group input, .form-group select {
  width: 100%; padding: 12px 14px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-text); font-size: 0.95rem; outline: none;
  transition: border-color var(--transition);
}
.form-group input:focus, .form-group select:focus { border-color: var(--color-primary); }
.form-group select option { background: #181d24; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 42px; padding: 10px 18px;
  border: none; border-radius: var(--radius-md);
  font-size: 0.92rem; font-weight: 800; cursor: pointer;
  transition: transform var(--transition), filter var(--transition), background var(--transition), border-color var(--transition);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary { background: var(--color-primary); color: #fff; box-shadow: 0 10px 22px rgba(79,152,163,0.26); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-accent { background: var(--color-accent); color: #271b00; box-shadow: 0 10px 22px rgba(232,175,52,0.24); }
.btn-ghost { background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); }
.btn-danger { background: var(--color-red); color: #fff; }
.btn-sm { min-height: 36px; padding: 8px 12px; font-size: 0.8rem; }
.btn-full { width: 100%; }

.divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--color-text-muted); font-size: 0.8rem; margin: 20px 0;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }

#game { flex-direction: row; overflow: hidden; }

.game-sidebar-left, .game-sidebar-right {
  background: rgba(24,29,36,0.95);
  backdrop-filter: blur(10px);
}

.game-sidebar-left {
  width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 16px; gap: 10px;
}

.game-main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: auto; position: relative; padding: 12px;
}

.game-sidebar-right {
  width: 300px; flex-shrink: 0;
  border-left: 1px solid var(--color-border);
  display: flex; flex-direction: column; overflow: hidden;
}

.sidebar-section-title {
  font-size: 0.72rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--color-text-muted); margin-bottom: 10px;
}

#board-shell {
  display: flex; flex-direction: column;
  gap: 12px; align-items: center; width: 100%;
}

.board-toolbar {
  width: min(100%, 980px);
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px;
  background: rgba(24,29,36,0.82);
  border: 1px solid var(--color-border);
  border-radius: 999px; padding: 10px 14px;
  box-shadow: var(--shadow-md); backdrop-filter: blur(12px);
}

.toolbar-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.toolbar-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--color-surface-2);
  border: 1px solid var(--color-border); border-radius: 999px;
  font-size: 0.85rem; color: var(--color-text-muted);
}

.zoom-wrap {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--color-surface-2);
  border: 1px solid var(--color-border); border-radius: 999px;
}

.zoom-wrap input[type="range"] { width: 140px; accent-color: var(--color-accent); }

#board-wrap {
  position: relative; aspect-ratio: 1 / 1;
  width: min(calc(100vh - 120px), calc(100vw - 620px), calc(var(--board-max-size) * 1px));
  min-width: 320px; min-height: 320px;
  transform: scale(var(--board-scale));
  transform-origin: center center;
  transition: transform var(--transition), width var(--transition);
}

#board-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
}

#board-overlay { position: absolute; inset: 0; pointer-events: none; }

.board-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 47%; height: 47%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 10px;
  pointer-events: auto; padding: 12px;
}

.board-logo {
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 2.8vw, 2.1rem);
  color: var(--color-text); line-height: 1;
  text-shadow: 0 4px 22px rgba(0,0,0,0.35);
}

.board-logo span {
  display: block; font-size: 0.42em; color: var(--color-text-muted);
  font-family: var(--font-body); font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px;
}

.dice-area { display: flex; gap: 12px; margin: 4px 0; }

.die {
  width: clamp(42px, 5.4vw, 56px); height: clamp(42px, 5.4vw, 56px);
  background: linear-gradient(180deg, #ffffff, #eef0f6);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: clamp(1.35rem, 2.7vw, 1.95rem);
  box-shadow: 0 10px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
  color: #1a1d27; font-weight: 900;
  will-change: transform; backface-visibility: hidden;
}

.die.rolling { animation: dieRoll 650ms cubic-bezier(.2,.8,.2,1); }

@keyframes dieRoll {
  0%   { transform: rotate(0deg) scale(0.92); }
  20%  { transform: rotate(140deg) scale(1.08) translateY(-3px); }
  45%  { transform: rotate(260deg) scale(1.18); }
  70%  { transform: rotate(330deg) scale(0.98) translateY(2px); }
  100% { transform: rotate(360deg) scale(1); }
}

.turn-banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(24,29,36,0.95); border: 1px solid var(--color-border);
  border-radius: 999px; padding: 8px 18px; font-size: 0.84rem; font-weight: 800;
  white-space: nowrap; box-shadow: var(--shadow-md); pointer-events: none; z-index: 10;
}

.compact-stack { display: flex; flex-direction: column; gap: 8px; }

.settings-grid { display: grid; gap: 12px; }

.settings-item {
  background: var(--color-surface-2); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: 12px 14px;
}

.settings-item label {
  display: block; font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--color-text-muted); margin-bottom: 8px; font-weight: 800;
}

.settings-value { margin-top: 8px; font-size: 0.82rem; color: var(--color-text-muted); }

.log-entry {
  font-size: 0.82rem; line-height: 1.5;
  padding: 8px 10px; margin-bottom: 6px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  border: 1px solid transparent; color: var(--color-text-muted);
}
.log-entry.highlight { background: rgba(79,152,163,0.10); border-color: rgba(79,152,163,0.18); color: var(--color-text); }
.log-entry.money    { background: rgba(109,170,69,0.10); border-color: rgba(109,170,69,0.18); }
.log-entry.danger   { background: rgba(209,99,99,0.12); border-color: rgba(209,99,99,0.18); }
.log-entry.info     { background: rgba(85,145,199,0.10); border-color: rgba(85,145,199,0.18); }

.player-card {
  background: var(--color-surface-2); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: 12px 14px;
  transition: border-color var(--transition), transform var(--transition);
}
.player-card.active-turn { border-color: var(--color-accent); box-shadow: 0 0 0 1px rgba(232,175,52,0.24) inset; }
.player-card.bankrupt { opacity: 0.45; filter: grayscale(0.25); }
.player-card .pc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.player-card .p-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.player-card .p-name { font-weight: 800; font-size: 0.9rem; line-height: 1.2; }
.player-card .p-tag  { font-size: 0.72rem; color: var(--color-text-muted); font-weight: 600; }
.player-card .p-money { font-family: var(--font-display); font-size: 1.15rem; color: var(--color-green); }
.player-card .p-pos  { font-size: 0.78rem; color: var(--color-text-muted); }
.player-card .p-props { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.prop-dot { width: 10px; height: 10px; border-radius: 50%; }

.trade-list, .property-list { display: flex; flex-direction: column; gap: 10px; max-height: 42vh; overflow: auto; padding-right: 4px; }
.trade-card, .property-row { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px; }
.trade-card h4, .trade-title { font-size: 0.95rem; margin-bottom: 6px; }
.trade-meta { color: var(--color-text-muted); font-size: 0.82rem; margin-bott
